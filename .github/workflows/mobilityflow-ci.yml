name: MobilityFlow CI

# Se déclenche seulement quand le projet MobilityFlow (ou ce fichier) change.
on:
  push:
    paths:
      - "projects/data-engineering/real-time-mobility-data-platform/**"
      - ".github/workflows/mobilityflow-ci.yml"
  pull_request:
    paths:
      - "projects/data-engineering/real-time-mobility-data-platform/**"
      - ".github/workflows/mobilityflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/data-engineering/real-time-mobility-data-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/data-engineering/real-time-mobility-data-platform/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Syntax check (all Python files compile)
        run: python -m compileall -q ingestion pipeline dags app tests exploration monitoring

      - name: Tests on fake data (JSON to Parquet, dbt run and test, dashboard data access)
        run: python -m pytest -v