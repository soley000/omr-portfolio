# MobilityFlow - Airflow en local (apprentissage, pas production).
# Un seul conteneur "airflow standalone" : serveur web + planificateur + base SQLite.
# Interface : http://localhost:8080
#
# Dossiers branchés dans le conteneur :
#   ./dags      -> /opt/airflow/dags      (les DAG = les plannings)
#   ./pipeline  -> /opt/airflow/pipeline  (tes scripts, en lecture seule)
#   ./dbt       -> /opt/airflow/dbt       (le projet dbt, en lecture seule)
#   données     -> /data                  (le dossier du collecteur)

services:
  airflow:
    build: .
    image: mobilityflow-airflow:local
    command: standalone
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Paris
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Variables lues par les scripts et par dbt (profiles.yml) À L'INTÉRIEUR du conteneur.
      MOBILITYFLOW_DATA_DIR: /data
      MOBILITYFLOW_WAREHOUSE_PATH: /tmp/warehouse/mobilityflow.duckdb
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./dbt:/opt/airflow/dbt:ro
      - ${MOBILITYFLOW_DATA_DIR:-C:/dev/mobilityflow-data}:/data

volumes:
  airflow-home: