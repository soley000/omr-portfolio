# Fournisseurs et modeles LLM (offres gratuites, quotas releves le 15/10/2026)
env_file: .env
temperature: 0
cache_subdir: llm_cache          # sous CHARGEDESK_DATA_DIR : un appel deja fait n'est jamais refait

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY

models:
  flash_lite:                    # candidat proprietaire
    provider: gemini
    model: gemini-3.5-flash-lite
    rpm: 15
    tpm: 250000
    rpd: 500
  gemma:                         # candidat a poids ouverts
    provider: gemini
    model: gemma-4-31b-it
    rpm: 30
    tpm: 16000
    rpd: 14400
    timeout_s: 300                # tres lent : jusqu'a 5 min par appel
  gpt_oss:                       # repli chez un autre fournisseur
    provider: groq
    model: openai/gpt-oss-120b
    rpm: 30
    tpm: 8000
    rpd: 1000
