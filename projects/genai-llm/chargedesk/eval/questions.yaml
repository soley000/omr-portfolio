# Jeu d'evaluation de ChargeDesk
#
# Redige le 15/10/2026, apres l'exploration des donnees (notebook 01) et AVANT
# tout code d'agent (outils, prompts). Une fois fige, il ne se modifie plus.
#
# Conventions de dates (les outils de l'agent devront suivre les memes) :
# - chaque question est posee le soir `evening` ; rien apres ce soir n'est connu ;
# - "les 7 derniers jours" = le soir courant inclus et les 6 jours precedents ;
# - "les 28 derniers jours" = le soir courant inclus et les 27 jours precedents ;
# - "ce mois-ci" / "depuis le debut du mois" = du 1er du mois au soir courant ;
# - "la liste" = le top 10 du modele champion ce soir-la ;
#   "la regle simple" = le top 10 du modele fallback (pannes sur 7 jours) ;
# - "muette" / "a l'arret" = aucune recharge sur les 7 derniers jours ;
# - "fiabilite de la liste" = part des bornes listees ayant eu un episode le
#   lendemain, sur les listes des 28 soirs precedents (resultats connus).
#
# Chaque chiffre attendu est calcule par sa requete `sql` (une seule valeur,
# nommee value) sur l'entrepot vu depuis le soir de la question. Les reponses
# attendues sont produites par `python -m chargedesk.eval.build_expected`.
# Chaque requete borne elle-meme ses dates au soir de la question : le script
# compare le resultat vu depuis ce soir et le resultat sur tout l'entrepot,
# et s'arrete s'ils different (la question dependrait du futur).

questions:

